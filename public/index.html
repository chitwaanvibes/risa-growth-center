<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusFest Sponsor Growth Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff8a65'/%3E%3Cstop offset='.45' stop-color='%23e5533f'/%3E%3Cstop offset='1' stop-color='%236c5ce7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M8 22l5-6 4 3 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#2e2a87">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">Sponsor Growth Center<small>CampusFest · Bengaluru · Challenge B: sponsorship cash</small></div>
      <div class="spacer"></div>
      <label class="ctl">Workspace <select id="ws"></select></label>
      <label class="ctl">As of <input id="asof" type="date"></label>
      <button class="btn sm" id="latest" title="Jump to the workspace's latest date">Latest</button>
      <span id="store" class="pill">Loading…</span>
      <button class="btn primary sm" id="cp-toggle">AI Copilot</button>
    </header>
    <nav class="side" id="nav"></nav>
    <main id="main"><p class="muted">Loading data…</p></main>
    <aside class="copilot" id="copilot"></aside>
  </div>
  <div class="tip" id="tip"></div>
  <dialog id="dlg"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
