<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusFest Sponsor Growth Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c111d'/%3E%3Cpath d='M8 21l6-6 4.5 3.5L24 11' stroke='white' stroke-width='2.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">Sponsor Growth Center<small>CampusFest Bengaluru · Challenge B · Sponsorship cash collected</small></div>
      <div class="spacer"></div>
      <label class="ctl">Workspace <select id="ws"></select></label>
      <label class="ctl">As of <input id="asof" type="date"></label>
      <button class="btn sm" id="latest" title="Jump to the workspace's latest date"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M16 2.5v3M8 2.5v3M3 9.5h18"/></svg>Latest</button>
      <span id="store" class="pill">Loading…</span>
      <button class="btn primary sm" id="cp-toggle"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 13.8 8.2 18.5 10 13.8 11.8 12 16.5 10.2 11.8 5.5 10 10.2 8.2z"/><path d="m18.5 15 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>AI Copilot</button>
    </header>
    <nav class="side" id="nav"></nav>
    <main id="main"><p class="muted">Loading data…</p></main>
    <aside class="copilot" id="copilot"></aside>
  </div>
  <div class="tip" id="tip"></div>
  <dialog id="dlg"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
